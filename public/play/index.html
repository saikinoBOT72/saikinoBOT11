<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<!-- ズーム禁止・切り欠きまで使う・ホーム画面から開いたときは全画面 -->
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#08131f">
<meta name="format-detection" content="telephone=no">
<link rel="icon" href="data:,">
<title>夕凪島</title>
<style>
  :root {
    --abyss:#08131F; --deep:#0F2739; --line:#24546B; --line-soft:#1A3D52;
    --ink:#F1E6D2; --ink-dim:#A9BDC6; --ink-faint:#6E8A97;
    --sun:#F2A65A; --dusk:#C96F81; --lagoon:#35B0A8; --danger:#E8837E;
  }

  /* --- スマホで邪魔になるブラウザの挙動をまとめて止める --- */
  * {
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;   /* タップ時の青い影 */
    -webkit-touch-callout:none;                /* 長押しの保存メニュー */
    -webkit-user-select:none; user-select:none;/* 長押しの文字選択 */
    -webkit-user-drag:none;                    /* 画像のドラッグ */
    touch-action:none;                         /* ダブルタップ拡大・ピンチ */
  }
  html, body {
    margin:0; padding:0; width:100%; height:100%;
    position:fixed; inset:0;                   /* 端のバウンドを止める */
    overflow:hidden; overscroll-behavior:none;
    background:var(--abyss); color:var(--ink);
    font-family:"Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;
    font-size:15px;
  }
  ::-webkit-scrollbar { width:0; height:0; display:none; }
  html { scrollbar-width:none; -ms-overflow-style:none; }
  img { -webkit-user-drag:none; pointer-events:none; }

  #stage { position:fixed; inset:0; }
  /* 回したときも中心に来るよう、中央に置いてから transform でずらす */
  #screen { position:absolute; left:50%; top:50%; transform-origin:center center; }
  canvas {
    display:block;
    image-rendering:pixelated; image-rendering:crisp-edges;
    background:#0E2A3C;
  }

  /* --- 画面の上に重ねる UI。Bot のメニューに寄せた見た目 --- */
  .hud { position:absolute; display:flex; gap:.5rem; align-items:center; pointer-events:none; }
  #topLeft  { left:2%; top:3%; }
  #topRight { right:2%; top:3%; }
  .chip {
    background:rgba(8,19,31,.82); border:1px solid var(--line); color:var(--ink);
    padding:.35em .7em; font-size:clamp(11px,1.5vh,15px); letter-spacing:.03em;
    font-variant-numeric:tabular-nums; white-space:nowrap;
    display:flex; align-items:center; gap:.4em;
  }
  .chip b { color:var(--sun); font-weight:700; }
  .chip.warn { border-color:var(--danger); color:var(--danger); }
  .chip img { width:1.15em; height:1.15em; image-rendering:pixelated; }

  #act {
    position:absolute; right:2%; bottom:5%; pointer-events:auto;
    background:var(--sun); color:#12101C; border:2px solid #12101C;
    font:700 clamp(13px,2.2vh,20px)/1 inherit; letter-spacing:.06em;
    padding:.85em 1.6em; cursor:pointer;
  }
  #act:disabled { background:var(--line-soft); color:var(--ink-faint); border-color:var(--abyss); cursor:default; }
  #act.hold { background:var(--dusk); transform:translateY(2px); }

  #hint {
    position:absolute; left:0; right:0; bottom:1%; text-align:center;
    color:var(--ink-dim); font-size:clamp(10px,1.5vh,13px); pointer-events:none;
    text-shadow:0 1px 2px rgba(8,19,31,.9);
  }

  /* --- 中央に出すお知らせ（釣果・エラー） --- */
  #card {
    position:absolute; left:50%; top:34%; transform:translate(-50%,-50%);
    min-width:min(78vw,340px); max-width:88vw;
    background:#F0E2C6;                        /* 砂に寄せたベージュ */
    color:#231B12; border:3px solid #12101C;
    box-shadow:5px 5px 0 rgba(18,16,28,.45);
    padding:1.1em 1.3em; text-align:center; display:none;
  }
  #card.show { display:block; }
  #card.n  { border-color:#5E6C79; }
  #card.r  { border-color:#1E6B7A; }
  #card.sr { border-color:#C97A15; box-shadow:5px 5px 0 rgba(18,16,28,.45), 0 0 0 5px rgba(242,166,90,.35); }
  #card .kind { font-size:clamp(10px,1.4vh,12px); letter-spacing:.18em; color:#7A6A55; font-weight:700; }
  #card .name { font-size:clamp(20px,3.6vh,34px); font-weight:800; margin:.15em 0 .1em; color:#231B12; }
  #card .meta { font-size:clamp(12px,1.8vh,16px); color:#4A3D2C; font-weight:600; }
  #card .miss { color:#A8322B; font-weight:800; }
  #card .pic { width:clamp(60px,11vh,104px); height:clamp(60px,11vh,104px); image-rendering:pixelated; }

  #boot {
    position:fixed; inset:0; display:grid; place-items:center; background:var(--abyss);
    color:var(--ink-dim); font-size:14px; text-align:center; padding:2rem; line-height:2; z-index:10;
  }
</style>
</head>
<body>
  <div id="stage">
    <div id="screen">
      <canvas id="cv" width="1280" height="720"></canvas>
      <div class="hud" id="topLeft">
        <span class="chip" id="baitChip">🪱 <b>—</b></span>
        <span class="chip" id="rodChip">—</span>
      </div>
      <div class="hud" id="topRight">
        <span class="chip" id="statChip">—</span>
      </div>
      <button id="act" disabled>よみこみ中</button>
      <div id="hint"></div>
      <div id="card"></div>
    </div>
  </div>
  <div id="boot">よみこみ中…</div>
  <script src="./game.js"></script>
</body>
</html>
