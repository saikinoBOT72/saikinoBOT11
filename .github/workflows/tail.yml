# 本番のBotが実際に何をしているかを、その場で覗く。
#
# 【使い方】PCは不要です。
#   1. Actions タブ → 左の「本番のログを見る」→ 右の「Run workflow」
#   2. 押してから **1分ほど待つ**（準備に時間がかかります）
#   3. 準備ができたら Discord で調べたい操作をする
#   4. 記録が終わると、実行ページの上に結果が出ます
#
# 何が分かるか:
#   outcome が ok          … ちゃんと返せている
#   outcome が exception   … 例外で落ちた（中身も出ます）
#   outcome が exceededCpu … 計算に時間をかけすぎて打ち切られた
#   そもそも記録が出ない    … Discord からBotに届いていない
name: 本番のログを見る

on:
  workflow_dispatch:
    inputs:
      seconds:
        description: 何秒ぶん記録するか（準備の1分は含みません）
        required: false
        default: '120'

jobs:
  tail:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 依存を入れる
        run: npm ci

      - name: 設定の仮IDを埋める
        # wrangler は設定ファイルを読むので、デプロイ時に差し替えている
        # 仮の DATABASE_ID のままだと止まってしまう。tail では使わないので何でもよい
        run: sed -i "s/DATABASE_ID_PLACEHOLDER/00000000-0000-0000-0000-000000000000/" wrangler.jsonc

      - name: ログを記録する
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "================================================"
          echo " ここから ${{ inputs.seconds }} 秒間、記録します"
          echo " いま Discord で調べたい操作をしてください"
          echo "================================================"
          # tail は繋ぎっぱなしになるので時間で打ち切る（打ち切りは失敗ではない）
          timeout "${{ inputs.seconds }}" npx wrangler tail saikinobot --format json > tail.jsonl 2> tail.err || true
          echo "================================================"
          echo " 記録おわり"
          echo "================================================"
          # wrangler が何を出したのかを必ず見せる。読めないときの手がかりになる
          echo "--- wrangler の出力（先頭30行）---"
          head -n 30 tail.jsonl || true
          echo "--- wrangler のエラー出力（先頭30行）---"
          head -n 30 tail.err || true
          echo "--- 行数: $(wc -l < tail.jsonl) ---"
          node scripts/read-tail.mjs tail.jsonl | tee -a "$GITHUB_STEP_SUMMARY"
