# 本番のBotが実際に何をしているかを、その場で覗く。
#
# 【使い方】PCは不要です。
#   1. Actions タブ → 左の「本番のログを見る」→ 右の「Run workflow」
#   2. 押してから **1分ほど待つ**（準備に時間がかかります）
#   3. 準備ができたら Discord で調べたい操作をする
#   4. 記録が終わると、実行ページの上に結果が出ます
#
# 何が分かるか:
#   outcome が ok          … ちゃんと返せている
#   outcome が exception   … 例外で落ちた（中身も出ます）
#   outcome が exceededCpu … 計算に時間をかけすぎて打ち切られた
#   そもそも記録が出ない    … Discord からBotに届いていない
#
# 【公開ログに出さないもの】このリポジトリは公開なので、ここに出たものは誰でも読める。
#   生の記録（リクエストの中身）はそのまま出さず、Discord の ID・URL・トークンを伏せた要約だけを出す。
name: 本番のログを見る

on:
  workflow_dispatch:
    inputs:
      seconds:
        description: 何秒ぶん記録するか（準備の1分は含みません）
        required: false
        default: '120'

permissions:
  contents: read

jobs:
  tail:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: 依存を入れる
        run: npm ci

      - name: 設定の仮IDを埋める
        # wrangler は設定ファイルを読むので、デプロイ時に差し替えている
        # 仮の DATABASE_ID のままだと止まってしまう。tail では使わないので何でもよい
        run: sed -i "s/DATABASE_ID_PLACEHOLDER/00000000-0000-0000-0000-000000000000/" wrangler.jsonc

      - name: ログを記録する
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SECONDS_TO_RECORD: ${{ inputs.seconds }}
        run: |
          # 入力は数字だけ受け付ける（コマンドに埋め込むため）
          case "$SECONDS_TO_RECORD" in ''|*[!0-9]*) SECONDS_TO_RECORD=120 ;; esac
          echo "================================================"
          echo " ここから ${SECONDS_TO_RECORD} 秒間、記録します"
          echo " いま Discord で調べたい操作をしてください"
          echo "================================================"
          # tail は繋ぎっぱなしになるので時間で打ち切る（打ち切りは失敗ではない）
          timeout "${SECONDS_TO_RECORD}" npx wrangler tail saikinobot --format json > tail.jsonl 2> tail.err || true
          echo "================================================"
          echo " 記録おわり（生の記録は出さず、伏せ字にした要約だけを出します）"
          echo "================================================"
          echo "--- 行数: $(wc -l < tail.jsonl) ---"
          # wrangler のエラー出力は手がかりになるが、URL や ID が混ざりうるので伏せてから出す
          echo "--- wrangler のエラー出力（先頭30行・伏せ字あり）---"
          head -n 30 tail.err \
            | sed -E 's#https?://[^ ]+#<url>#g; s/[0-9]{15,}/<id>/g; s/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}/<uuid>/g' \
            || true
          node scripts/read-tail.mjs tail.jsonl | tee -a "$GITHUB_STEP_SUMMARY"
