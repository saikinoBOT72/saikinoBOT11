# GitHub にプッシュすると Cloudflare へ自動で反映される。
# PCは不要で、必要な設定はすべて GitHub のシークレット（Settings → Secrets and variables → Actions）。
#
#   CLOUDFLARE_API_TOKEN   Cloudflare のAPIトークン（Workers と D1 を編集できるもの）
#   CLOUDFLARE_ACCOUNT_ID  Cloudflare のアカウントID
#   DISCORD_TOKEN          Bot トークン
#   DISCORD_PUBLIC_KEY     Public Key（署名の確認に使う）
#   DISCORD_APPLICATION_ID Application ID
#   DISCORD_GUILD_ID       （任意）自分のサーバーID。入れるとコマンドが即反映される
name: デプロイ

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  DATABASE_NAME: saikinobot

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 依存を入れる
        run: npm ci

      - name: テスト
        run: npm test

      - name: D1 データベースを用意する
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database"
          AUTH="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          ID=$(curl -sS -H "$AUTH" "${API}?name=${DATABASE_NAME}" | jq -r '.result[0].uuid // empty')
          if [ -z "$ID" ]; then
            echo "データベースが無いので作成します"
            ID=$(curl -sS -X POST -H "$AUTH" -H 'content-type: application/json' \
                   -d "{\"name\":\"${DATABASE_NAME}\"}" "$API" | jq -r '.result.uuid')
          fi
          if [ -z "$ID" ] || [ "$ID" = "null" ]; then
            echo "D1 データベースを用意できませんでした。APIトークンの権限を確認してください。" >&2
            exit 1
          fi
          sed -i "s/DATABASE_ID_PLACEHOLDER/${ID}/" wrangler.jsonc
          echo "D1: ${ID}"

      - name: テーブルを最新にする
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply "${DATABASE_NAME}" --remote

      - name: Bot をデプロイする
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler deploy | tee deploy.log
          URL=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1 || true)
          {
            echo "## デプロイ完了"
            if [ -n "$URL" ]; then
              echo ""
              echo "Discord Developer Portal の **Interactions Endpoint URL** にこれを入れてください："
              echo ""
              echo '```'
              echo "$URL"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: トークンを Cloudflare に渡す
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          DISCORD_PUBLIC_KEY: ${{ secrets.DISCORD_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          printf '%s' "$DISCORD_TOKEN" | npx wrangler secret put DISCORD_TOKEN
          printf '%s' "$DISCORD_PUBLIC_KEY" | npx wrangler secret put DISCORD_PUBLIC_KEY

      - name: スラッシュコマンドを登録する
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          DISCORD_APPLICATION_ID: ${{ secrets.DISCORD_APPLICATION_ID }}
          DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
        run: node scripts/register-commands.mjs
